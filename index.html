<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>탈모 디펜스 : 이상연의 마지막 한 올</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div id="wrap">
<div id="gameShell">
<canvas id="game" width="960" height="540"></canvas>

<div id="topbar">
  <div class="chip" id="title">🧑‍🦲 탈모 디펜스 : 이상연의 마지막 한 올</div>
  <div class="chip">🌱 <span id="gold">0</span></div>
  <div class="chip">🧬 <span id="life">0</span></div>
  <div class="chip">🌊 <span id="wave">0/15</span></div>
</div>

<div id="legend">
  <span class="badge phys">물리</span> 머리카락·케라틴 ·
  <span class="badge spec">특수</span> 성장 신호 ·
  <span class="badge rally">영웅</span> 좌클릭/드래그 선택 → 우클릭 이동
</div>

<div id="preview"></div>

<div id="augmentTracker">
  <div id="augmentTrackerTitle">🧬 획득 증강 <span id="augmentCount">0</span>/5</div>
  <div id="augmentList">없음</div>
</div>

<div id="audioSettings">
  <button id="audioToggle" type="button">🔊 사운드</button>
  <div id="audioMenu">
    <label>BGM <span id="bgmValue">35</span>%</label>
    <input id="bgmVolume" type="range" min="0" max="100" step="1" value="35" />
    <label>효과음 <span id="sfxValue">55</span>%</label>
    <input id="sfxVolume" type="range" min="0" max="100" step="1" value="55" />
    <button id="muteBtn" type="button">🔊 음소거</button>
  </div>
</div>

<div id="toast"></div>

<div id="controls">
  <button id="waveBtn">▶ 다음 웨이브</button>
  <button class="skill" id="minoBtn">💧 미녹시딜<br><small id="minoCd">사용 가능</small></button>
  <button class="skill" id="massageBtn">🫳 두피 마사지<br><small id="massageCd">사용 가능</small></button>
  <button class="skill" id="nutriBtn">🥚 영양 공급<br><small id="nutriCd">사용 가능</small></button>
</div>

<div id="panel">
  <h3 id="panelTitle"></h3>
  <p id="panelDesc"></p>
  <div id="panelBody"></div>
</div>

<div id="eventBanner">
  <div id="eventBannerCard">
    <div id="eventBannerTitle"></div>
    <div id="eventBannerText"></div>
  </div>
</div>

<div id="augmentOverlay">
  <div id="augmentPanel">
    <div id="augmentHeader">
      <div>🧬 성장 증강 선택</div>
      <small>이번 판의 빌드를 바꿀 한 가지를 선택하세요. 선택 중에는 전투가 완전히 정지합니다.</small>
    </div>
    <div id="augmentCards"></div>
  </div>
</div>

<div id="story">
  <div id="storyCard">
    <div id="storyCount">1 / 4</div>
    <button id="storySkip" type="button">SKIP</button>
    <div id="storyScene">
      <img id="storyImage" src="./assets/intro/intro1.jpg" alt="오프닝 1" />
    </div>
    <div id="storyText"></div>
    <div id="storyHint">화면 클릭 / Space / Enter</div>
    <button id="storyNext" type="button">다음 ▶</button>
  </div>
</div>

<div id="modal">
  <div id="modalCard">
    <div id="modalVisual">
      <img id="modalImage" src="" alt="엔딩 화면" />
      <div id="modalVignette"></div>
      <div id="modalTopText">
        <div id="modalTitle"></div>
        <div id="modalCaption"></div>
      </div>
    </div>
    <p id="modalText"></p>
    <button id="restartBtn" type="button">처음으로 돌아가기</button>
  </div>
</div>
</div>
</div>
<script src="./game.js"></script>
</body>
</html>
